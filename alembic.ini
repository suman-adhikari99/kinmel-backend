# Alembic Configuration
# =====================
# Migration management for Kinmel Inventory System
#
# IMPORTANT: This file should be version controlled.
# Database URL comes from environment (never hardcode credentials).

[alembic]
# Path to migration scripts directory
script_location = alembic

# Template for migration version IDs
# Format: YYYYMMDD_HHMM_<description>
# Example: 20240115_1430_add_products_table
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# Prepend sys.path with the project root
prepend_sys_path = .

# Timezone for migration timestamps
timezone = UTC

# Truncate long migration names
truncate_slug_length = 50

# Version table name in database
version_table = alembic_version

# Version table schema (use default schema)
# version_table_schema = public

# Output encoding for script files
output_encoding = utf-8

# ─────────────────────────────────────────────────────────────────
# Post-write hooks
# ─────────────────────────────────────────────────────────────────
# Run ruff format after generating migrations

[post_write_hooks]
hooks = ruff_format

ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

# ─────────────────────────────────────────────────────────────────
# Logging Configuration
# ─────────────────────────────────────────────────────────────────

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
